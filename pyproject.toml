[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bikefinder"
version = "0.1.0"
description = "Monitor classifieds (Subito + pluggable sources) for listings matching a stolen bike (personal use)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "google-genai>=1.10.0",
    "google-cloud-storage>=2.16.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
bikefinder = "bikefinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
